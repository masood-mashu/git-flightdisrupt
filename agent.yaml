spec_version: "0.1.0"
name: git-flightdisrupt
version: 1.0.0
description: "Autonomous Airline Flight Delay EU261 Compensation, Passenger Rebooking & Baggage SLA Agent"
author: "masood-mashu"
license: "Apache-2.0"

model:
  preferred: "openai:gpt-4o"
  fallback:
    - "anthropic:claude-3-5-sonnet"
    - "openai:gpt-4o-mini"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - eu261-compensation-adjudication
  - passenger-rebooking-optimization

tools:
  - eu261-compensation-calculator
  - passenger-reroute-optimizer
  - baggage-sla-tracker

runtime:
  max_turns: 50
  timeout: 120

tags:
  - travel-hospitality
  - aviation
  - eu261
  - flight-disruptions
  - passport-challenge

metadata:
  passport_id: "aps-flightdisrupt-01"
  passport_category: "Travel & hospitality"
