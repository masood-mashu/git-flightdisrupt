name: eu261-compensation-calculator
version: 1.0.0
description: "Calculates EU261 statutory compensation eligibility in Euros based on flight distance and delay duration"
input_schema:
  type: object
  properties:
    delay_data_json:
      type: string
      description: "JSON string containing delay_minutes, distance_km, and extraordinary_circumstance (bool)"
  required:
    - delay_data_json
implementation:
  type: script
  path: eu261_compensation_calculator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
