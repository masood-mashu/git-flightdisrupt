name: passenger-reroute-optimizer
version: 1.0.0
description: "Evaluates candidate rebooking flights to ensure departure within 12 hours of canceled flight"
input_schema:
  type: object
  properties:
    rebooking_data_json:
      type: string
      description: "JSON string containing candidate_departure_offset_hours"
  required:
    - rebooking_data_json
implementation:
  type: script
  path: passenger_reroute_optimizer.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
